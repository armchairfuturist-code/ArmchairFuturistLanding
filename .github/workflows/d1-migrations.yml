name: D1 Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # Requires a CLOUDFLARE_API_TOKEN with the "Workers D1:Edit" permission
      # scoped to account 86a92d3f5ed4b3313381515ca4208ae7. Idempotent: wrangler
      # skips migrations already recorded in the d1_migrations table.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply armchair-futurist --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: 86a92d3f5ed4b3313381515ca4208ae7
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
