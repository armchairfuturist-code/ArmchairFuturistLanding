name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint & typecheck
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      # The Firebase CLI runs `next build` itself — firebase-tools
      # lib/frameworks/next/index.js spawns `next build` unconditionally, so the
      # .next produced above is never what gets deployed. Leaving it in place
      # makes the CLI's build run on top of existing output, and when that
      # second build fails the CLI ignores the exit code and reports a
      # misleading "ENOENT: .next/server/middleware-manifest.json" instead of
      # the real error. Clearing the output gives the CLI one clean build.
      - name: Clear build output before deploy
        run: rm -rf .next

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARMCHAIR_FUTURIST }}
          channelId: live
          projectId: armchair-futurist
