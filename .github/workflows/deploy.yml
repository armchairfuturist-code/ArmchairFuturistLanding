name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint & typecheck
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          # firebase-tools' frameworks step generates a function package.json that
          # pairs our firebase-admin (v14) with firebase-frameworks@^0.11.0, whose
          # peer range stops at ^13 — no firebase-frameworks release supports 14
          # yet — so the CLI's `npm i --omit dev --no-audit` ERESOLVEs. Let that
          # one generated install skip peer enforcement; firebase-frameworks only
          # uses core admin auth APIs (verifyIdToken/createSessionCookie), stable
          # across 13->14. Scoped to this step: npm ci/build/test still enforce
          # peers.
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARMCHAIR_FUTURIST }}
          channelId: live
          projectId: armchair-futurist
          # The action defaults this to "latest" and runs `npx firebase-tools@latest`,
          # which installs a fresh CLI on every deploy. In the run of 2026-10-15 that
          # fresh install was the step that failed: the log shows npx downloading
          # firebase-tools@15.34.0 and then the CLI dying with an ENOENT before it
          # built anything, while the action's own retry reused the now-cached CLI
          # and deployed fine. Pinning keeps one known-good CLI on every run.
          firebaseToolsVersion: "15.34.0"
