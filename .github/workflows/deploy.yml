name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main cancels the in-flight deploy: only the newest
# commit's deploy matters, and each run takes ~4 min.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # The deploy action runs `npx firebase-tools@15.34.0`; without this cache
      # every run re-extracts 361 packages into ~/.npm/_npx (~46s). setup-node's
      # own cache never picks _npx up: its lockfile-hash key is a primary-key
      # hit, so the post step skips saving. Bump this key together with
      # firebaseToolsVersion below.
      - name: Cache npx firebase-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm/_npx
          key: npx-firebase-tools-15.34.0

      - run: npm ci

      # tsc and vitest are independent and read-only; in parallel they save
      # ~8s. Build stays a separate step for clean logs.
      - name: Lint, typecheck, geo & test
        run: |
          set +e
          npm run lint & P1=$!
          npx vitest run & P2=$!
          npm run geo:check & P3=$!
          FAIL=0
          wait $P1 || { echo "::error::tsc --noEmit failed"; FAIL=1; }
          wait $P2 || { echo "::error::vitest failed"; FAIL=1; }
          wait $P3 || { echo "::error::geo drift check failed"; FAIL=1; }
          exit $FAIL

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          # The generated Cloud Function install is unblocked by the repo .npmrc
          # (legacy-peer-deps=true): firebase-tools copies it into the function
          # bundle, so it covers both the CLI's local `npm i --omit dev` and the
          # Cloud Build container install, which a step-level env var cannot
          # reach.
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARMCHAIR_FUTURIST }}
          channelId: live
          projectId: armchair-futurist
          # The action defaults this to "latest" and runs `npx firebase-tools@latest`,
          # which installs a fresh CLI on every deploy. In the run of 2026-10-15 that
          # fresh install was the step that failed: the log shows npx downloading
          # firebase-tools@15.34.0 and then the CLI dying with an ENOENT before it
          # built anything, while the action's own retry reused the now-cached CLI
          # and deployed fine. Pinning keeps one known-good CLI on every run.
          firebaseToolsVersion: "15.34.0"

      - name: Ping IndexNow
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs
