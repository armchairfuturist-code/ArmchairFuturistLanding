name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main queues behind the in-flight deploy rather than
# cancelling it: the D1 migration step is not safe to abort mid-run.
concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # tsc, vitest, and the geo/llms freshness check are independent and
      # read-only; in parallel they save ~8s. Build stays a separate step.
      - name: Lint, typecheck, geo & test
        run: |
          set +e
          npm run lint & P1=$!
          npx vitest run & P2=$!
          npm run geo:check & P3=$!
          FAIL=0
          wait $P1 || { echo "::error::tsc --noEmit failed"; FAIL=1; }
          wait $P2 || { echo "::error::vitest failed"; FAIL=1; }
          wait $P3 || { echo "::error::geo drift check failed"; FAIL=1; }
          exit $FAIL

      - run: npm run cf:build

      # D1 migrations run via the manual d1-migrations.yml workflow (or locally
      # with `npx wrangler d1 migrations apply armchair-futurist --remote`):
      # the CI token lacks the Workers D1 permission. Migrations are idempotent
      # and must land before a deploy that depends on them.
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: 86a92d3f5ed4b3313381515ca4208ae7
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
