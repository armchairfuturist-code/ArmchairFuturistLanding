name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # preview URL comment on the PR

env:
  CLOUDFLARE_ACCOUNT_ID: 86a92d3f5ed4b3313381515ca4208ae7
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run lint` IS `tsc --noEmit` here. The three checks are read-only and
      # independent, so they run in parallel and save ~8s.
      - name: Lint, typecheck, geo & test
        run: |
          set +e
          npm run lint & P1=$!
          npx vitest run & P2=$!
          npm run geo:check & P3=$!
          FAIL=0
          wait $P1 || { echo "::error::tsc --noEmit failed"; FAIL=1; }
          wait $P2 || { echo "::error::vitest failed"; FAIL=1; }
          wait $P3 || { echo "::error::geo drift check failed"; FAIL=1; }
          exit $FAIL

      - run: npm run cf:build

      # PR previews: each PR gets its own Worker version backed by a throwaway
      # D1 database (armchair-futurist-preview), never the production one.
      # Fork PRs have no secrets, so they skip the preview and only run checks.
      - name: Apply preview D1 migrations
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler d1 migrations apply armchair-futurist-preview --remote --env preview

      - name: Upload preview version
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview
        run: |
          set -o pipefail
          npx wrangler versions upload --env preview 2>&1 | tee preview.log
          URL=$(grep -o 'https://[a-z0-9-]*\.armchairfuturist\.workers\.dev' preview.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          test -n "$URL"

      - name: Comment preview URL
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.preview.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
