  <section id="roi-calculator" class="section roi" aria-label="ROI Calculator">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">{{EYEBROW}}</p>
        <h2>{{TITLE}}</h2>
        <p>{{LEDE}}</p>
      </div>
      <div class="roi-grid">
        <div class="roi-tasks" id="roi-tasks">
          <h3 class="display" style="font-size: 16px; margin: 0 0 8px; text-transform: none;">{{SELECT_LABEL}}</h3>
          {{TASKS}}
        </div>
        <div class="roi-estimate">
          <h3 class="display" style="font-size: 16px; margin: 0; text-transform: none;">{{ESTIMATE_LABEL}}</h3>
          <div class="value" id="roi-value">0h</div>
          <div class="label-text">reclaimed per week</div>
          <div class="breakdown" id="roi-breakdown">Pick tasks to see your number.</div>
          <a class="btn btn--primary" href="#connect">Talk through your savings</a>
        </div>
      </div>
    </div>
  </section>
