  <section id="latest-insights" class="section" aria-label="Latest Insights">
    <div class="container">
      <div class="section-head">
        <h2>{{TITLE}}</h2>
        <p>{{LEDE}}</p>
      </div>
      <div class="insights-grid">
        <div>
          <h3 class="display" style="font-size: 18px; margin: 0 0 12px;">{{ARTICLES_LABEL}}</h3>
          <div class="articles">{{ARTICLES}}</div>
          <a class="btn btn--ghost" style="margin-top: 16px;" href="#">{{VIEW_ALL}}</a>
        </div>
        <div>
          <h3 class="display" style="font-size: 18px; margin: 0 0 12px;">{{PODCASTS_LABEL}}</h3>
          <div class="podcasts">{{PODCASTS}}</div>
          <a class="btn btn--ghost" style="margin-top: 16px;" href="#">{{SHOW_MORE}}</a>
        </div>
      </div>
    </div>
  </section>
